{% extends "base.html" %}

{% block title %}Update Balance - Banking System{% endblock %}

{% block content %}
<div class="card">
    <h2>Update Account Balance</h2>
    
    <div class="member-detail">
        <p><strong>Member:</strong> {{ member.name }} ({{ member.member_id }})</p>
    </div>
    
    <form method="POST" id="update_form">
        <div class="form-group">
            <label for="account_type">Select Account:</label>
            <select id="account_type" name="account_type" required>
                <option value="">-- Choose an account --</option>
                {% for account in accounts %}
                <option value="{{ account.account_type }}">
                    {{ account.account_type }} (Current: ${{ "%.2f"|format(account.balance) }})
                </option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="new_balance">New Balance:</label>
            <input type="number" id="new_balance" name="new_balance" placeholder="0.00" step="0.01" min="0" required>
        </div>
        
        <div class="form-group">
            <label for="notes">Notes (Optional):</label>
            <textarea id="notes" name="notes" placeholder="Any notes about this update..." rows="4"></textarea>
        </div>
        
        <div class="button-group">
            <a href="{{ url_for('member_bp.member_detail', member_id=member.member_id) }}" style="display: inline-block; flex: 1;">
                <button type="button" class="btn-secondary" style="width: 100%;">Cancel</button>
            </a>
            <button type="submit" style="flex: 1;">Continue to Confirmation →</button>
        </div>
    </form>
</div>
{% endblock %}
